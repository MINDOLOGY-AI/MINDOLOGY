<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>interpviz</title>
    <link rel="stylesheet" href="components/TechnoParadisalTheme.css">
    <link rel="stylesheet" href="components/BoardCanvas/BoardCanvas.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>interpviz</h1>
        <div id="tabs">
            <button class="tab active" data-tab="graph">graph</button>
            <button class="tab" data-tab="sae">probes</button>
        </div>
        <div id="controls">
            <input id="meta-folder" type="text" value="interpviz/models/qwen3_5_4b" placeholder="meta folder (e.g. interpviz/models/qwen3_5_4b)">
            <button id="btn-load">load</button>
            <span class="sep"></span>
            <span id="model-status"></span>
            <span class="sep"></span>
            <button id="btn-device">cpu</button>
        </div>
    </header>
    <!-- the edits of the session, one chip each -->
    <div id="editbar">
        <span id="sae-edits"></span>
    </div>
    <!-- second bar: controls of the open tab -->
    <div id="subbar">
        <div id="graph-controls" class="tab-controls">
            <textarea id="input-tensor" rows="1" placeholder="inputs JSON">[[[0, 1]]]</textarea>
            <button id="btn-forward">forward</button>
            <span class="sep"></span>
            <button id="btn-groups">groups</button>
            <button id="btn-mark-mode" title="click nodes to mark/unmark them">mark mode</button>
            <button id="btn-marks" title="list marked nodes">marks</button>
            <span class="sep"></span>
            <button id="btn-capture-mode" class="active">show marked</button>
            <span class="sep"></span>
            <button id="btn-edits" title="neuron edits and presets">edits</button>
        </div>
        <div id="sae-controls" class="tab-controls" style="display:none;">
            <button id="btn-sae-attr" title="color by attribution to one token's prediction">attribute</button>
            <span id="sae-attr-info"></span>
        </div>
    </div>
    <board-canvas id="board"></board-canvas>
    <!-- graph tab: neuron search / edit, every edit of the session, presets -->
    <div id="edit-panel" class="group-panel" style="display:none;"></div>
    <div id="sae-view" style="display:none;">
        <div id="sae-grid"></div>
        <div id="sae-side">
            <div id="sae-side-top"></div>
            <div id="sae-side-bottom"></div>
        </div>
    </div>

    <!-- chat popup (bottom left, both tabs): the session's conversation, shared by every open window -->
    <div id="chat">
        <div id="chat-head" class="tab-controls">
            <span class="chat-title">chat</span>
            <select id="sae-set" title="interp method: which hook set's latents a run reads (none: tokens and next-token guesses only)"></select>
            <label title="qwen's thinking block before the answer"><input id="chat-think" type="checkbox"> think</label>
            <label title="no chat template: the messages are joined as plain text and the model continues it"><input id="chat-raw" type="checkbox"> raw</label>
            <label title="loop breaker (DRY): a token that would continue a stretch the reply already wrote is pushed down, harder the longer the stretch; off: plain greedy"><input id="chat-noloop" type="checkbox" checked> no loops</label>
            <input id="chat-max" type="number" min="1" value="200" title="max reply tokens">
            <button id="chat-new" title="start a new conversation">new</button>
            <button id="chat-min" title="minimize">–</button>
        </div>
        <div id="chat-log"></div>
        <div id="chat-foot" class="tab-controls">
            <textarea id="chat-input" rows="2" placeholder="message (Enter sends, Shift+Enter: new line)"></textarea>
            <button id="chat-send">send</button>
            <button id="chat-regen" title="regenerate the last reply">↻</button>
        </div>
    </div>
    <button id="chat-open" style="display:none;">chat</button>

    <script type="module" src="components/BoardCanvas/BoardCanvas.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
